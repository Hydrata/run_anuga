name: CI

# TASK-2147 W0.4: run_anuga is unified onto a single canonical `main` branch, so CI
# triggers on main only (the divergent 5.x lineage was merged in — see the 6ab2549
# single-main merge). Feature work rides epic/** branches and gates on the PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux-only: run_anuga runs exclusively on Linux (localhost dev box +
        # AWS Batch containers), never Windows. The windows-latest cells only ever
        # surfaced Windows-runner/POSIX artifacts (entropy-init crash, os.path.join
        # backslash, sub-ms timer granularity, POSIX-only signal.SIGALRM) — zero
        # signal about the runtime we ship. See greenify pass-3 (2026-07-15).
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        # TASK-1226: coverage baseline for the light job (rasterio now runs the
        # 7 nodata-guard tests here too, since [dev] carries it — see pyproject).
        # RUN_ANUGA_EXPECT_RASTERIO arms test_rasterio_present_when_ci_expects_it
        # (TASK-2302 fix-pass finding f4): this job installs [dev], which is
        # supposed to carry rasterio, so a silent loss of it must fail loudly
        # here instead of the 7 nodata-guard tests just quietly re-skipping.
        env:
          RUN_ANUGA_EXPECT_RASTERIO: "1"
        run: pytest tests/ -v -m "not requires_anuga and not requires_geo and not mpi" --cov=run_anuga --cov-report=term-missing

  test-geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install package with sim + dev dependencies
        run: |
          pip install --upgrade pip
          # Pin the GDAL python bindings to the runner's system libgdal: run_utils.py
          # needs osgeo.ogr/osr (via import_optional), and an unpinned `GDAL` grabs a
          # newer PyPI release whose build fails against the older system headers.
          pip install "GDAL==$(gdal-config --version)"
          pip install -e ".[dev,sim]"

      - name: Run geo component tests
        run: pytest tests/ -v -m "requires_geo and not requires_anuga"

  # TASK-2147 W0.4 — REQUIRED physics gate. The field-validated Merewether ARR
  # urban-flood benchmark (± 0.3 m at 5 gauges) is the trust anchor for the whole
  # rain-on-grid chain: a green unit suite does NOT prove the water is right. This
  # gate runs the full ANUGA stack and must pass on every push/PR to main. It is
  # deliberately slow-and-trusted (the Merewether e2e is ~9 min) — do not make it
  # non-blocking or move it to a nightly. See TASK-2149 for the mesh geo-reference
  # bug this benchmark caught (silently-wrong flood levels on the production path).
  test-anuga-e2e:
    name: ANUGA e2e — Merewether field benchmark (required)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system GDAL + ANUGA fork build toolchain
        run: |
          sudo apt-get update
          # libgdal-dev/gdal-bin for the GDAL bindings; build-essential/gfortran/
          # libopenmpi-dev to compile the anuga_core C/Fortran extensions from source
          # (mirrors anuga_core's own ci.yml Ubuntu build).
          sudo apt-get install -y gdal-bin libgdal-dev build-essential gfortran libopenmpi-dev

      - name: Install package with full deps + GDAL bindings
        run: |
          pip install --upgrade pip
          # numpy before GDAL so osgeo builds its numpy-backed gdal_array too; pin the
          # GDAL bindings to the system libgdal (see test-geo). [full] pulls PyPI anuga
          # here — replaced by the fork in the next step.
          pip install numpy "GDAL==$(gdal-config --version)"
          pip install -e ".[full,dev]"

      # The required physics gate must validate the SAME engine prod runs: the Hydrata
      # anuga_core FORK (localhost + AWS Batch), NOT PyPI upstream `anuga`. Upstream's
      # spatialInputUtil.getRasterExtent cannot import gdal/ogr in this env (the fork
      # carries the rasterio-fallback glue) — which is why every requires_anuga test
      # failed on `ImportError: Failed to import gdal/ogr`. Force-reinstall the fork over
      # the PyPI wheel that [full] just pulled; --no-deps because [full]/PyPI-anuga
      # already installed the shared runtime deps (numpy, scipy, netCDF4, pymetis, dill).
      #
      # TASK-2298: pinned to a deliberate anuga_core SHA (was unpinned `@main`) — under
      # branch protection an unpinned cross-repo ref means any anuga_core merge instantly
      # reds every run_anuga PR, with the fix landing in another repo and no blame signal
      # (TASK-1477's exact failure mode). Ratchet owner + cadence:
      # docs/fleet-enforcement/pin-ratchet.md in Hydrata/deploy. Pinned SHA = the
      # DEPLOYED anuga_core commit (Hydrata/deploy ansible/release.yml default
      # .anuga_core_commit_sha), currently 93368189 — TASK-2758's merge of
      # upstream ANUGA tag 4.0.0 into the fork's main, shipped to all four prod
      # sites 2026-09-10 (was ad1bfe71, TASK-2147's rain-on-grid-trust merge).
      - name: Install the Hydrata anuga_core fork (prod engine, not PyPI upstream)
        run: |
          # TASK-2863 (AC4, closing it out): Cython 3.3.0 (released 2026-08-22)
          # rejected the fork's dict-view -> cdef list assignments
          # (sparse_matrix_ext.pyx:73-74), and the fork's [build-system] declared
          # an UNBOUNDED "Cython" — so a build-isolated install started redding
          # this required gate with no code change on our side (last green
          # 2026-08-16, Cython 3.2.x). Worked around here with a `cython<3.3` cap
          # and --no-build-isolation (mirrors batch/Dockerfile) until the pin
          # below moved past the fork-side fix.
          #
          # The pin bump below (TASK-2758's sync of upstream tag 4.0.0 into the
          # fork's main, commit 93368189) carries the fix — verified:
          #   git -C anuga_core grep -nE \
          #     'cdef (list|dict) [a-zA-Z_]+ *= *[a-zA-Z_.]+\.(items|keys|values)\(\)' \
          #     origin/main -- '*.pyx'
          #   -> no matches
          # so the cap is dropped in this same change. Note WHERE that bound has
          # to live: the install below is --no-build-isolation, so pip never
          # reads the fork's [build-system] requires — the Cython that compiles
          # the .pyx is the one the explicit line below puts in the env, and
          # nothing else. Leaving it unbounded HERE is the deliberate choice:
          # this job runs on every PR, so it is the fleet's early warning that
          # the next Cython release still builds the fork. batch/Dockerfile is
          # bounded instead (`cython<4`) because an image build is a ship path,
          # not a canary — it must not discover a Cython break at bake time.
          pip install cython meson-python meson ninja pybind11 setuptools wheel

          # fiona: NOT a declared dependency of anything in this graph, and the
          # engine hard-needs it. anuga/utilities/spatialInputUtil.py gates its
          # whole geodata surface behind `try: import fiona, rasterio, shapely`
          # (spatial_available); with the flag False, getRasterExtent raises and
          # every set_quantity('elevation', <raster>) dies mid-run. rasterio and
          # shapely arrive via run_anuga[sim] above — fiona does NOT: geopandas
          # 1.x moved to pyogrio, and anuga 4.0.0 declares fiona only under
          # `extra == "data"`, so the resolved set has no fiona at all.
          #
          # Prod installs it explicitly on all three surfaces, which is why prod
          # is unaffected: ansible install-anuga.yml (fiona>=1.9,<1.11
          # --no-binary, TASK-1279), batch/Dockerfile's cpu stage, and the
          # gpu-dev base (Dockerfile.gpu-dev — fiona rasterio shapely). CI was
          # the ONLY surface without it, and only stopped getting away with that
          # when the pin above crossed the upstream commits that removed
          # spatialInputUtil's gdal/ogr fallback tier (d34a5ae4/74e65a3a/
          # ca807d48, all 2026-04..07 — in the fork since 7f1a4847, i.e. in
          # PRODUCTION since August). The pin bump did not cause this; it is the
          # first time CI jumped over it, because the old pin ad1bfe71 predates
          # the whole series.
          #
          # Version range from ansible (the proven one); wheel, not --no-binary,
          # to match the gpu-dev base that the only supported Batch target
          # actually runs. Bounded on purpose — an unbounded dep floating onto a
          # breaking release is the exact TASK-2863 shape this PR closes out.
          pip install "fiona>=1.9,<1.11"

          pip install --force-reinstall --no-deps --no-build-isolation "anuga @ git+https://github.com/Hydrata/anuga_core.git@93368189eb35eef847094dde027d6d6dcb2b0059"
          # Anti-paper-gate: assert the CAPABILITY, not just importability.
          # spatial_available is the fork's own gate — if fiona/rasterio/shapely
          # is missing OR has a GDAL ABI mismatch, this fails HERE with the real
          # cause, instead of 14 failures + 29 errors 90s later in pytest whose
          # shared root cause has to be read out of a traceback.
          python -c "import anuga; from anuga.utilities import spatialInputUtil as su; assert su.spatial_available, su.spatial_import_error; from osgeo import gdal, ogr; print('anuga', anuga.__version__, '| geodata interface live | gdal/ogr import OK')"

      - name: Merewether ARR benchmark + ANUGA integration tests
        run: pytest tests/ -v -m requires_anuga --timeout=1800

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned 2026-08-06: unpinned `pip install ruff` made lint a moving
        # target — ruff 0.16.1 (released between fleet runs) flagged 225
        # PRE-EXISTING repo-wide issues on a docstring-only PR (run_anuga#6);
        # 0.15.2 is clean on the same tree. Bump deliberately, paired with a
        # `ruff check --fix` sweep in its own commit.
        run: pip install ruff==0.15.2

      - name: Run ruff check
        run: ruff check run_anuga/ tests/

  # TASK-2329 (epic 2290 W4): fleet marker/quarantine taxonomy lint. Pure static
  # AST/regex scan — no install, no GDAL, no ANUGA — so it's a thin
  # checkout+python job (unlike test-geo/test which build the C-extension stack).
  # The script is VENDORED at .github/scripts/marker_lint.py (canonical source:
  # Hydrata/deploy scripts/marker_lint.py) because the default GITHUB_TOKEN
  # cannot check out a different private repo — same precedent as the fleet's
  # other vendored gate scripts. Cap pins the CURRENT baseline (29
  # conditional-skips — run_anuga's optional-dependency / requires_* env guards)
  # as the interim ceiling to ratchet DOWN. A new bare xfail / bare-skip, or any
  # marker missing its governance kwargs, reds this job. NOT a required check
  # this wave (green-then-require; the require-flip is a later operator step).
  marker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Marker taxonomy lint (static scan, no deps)
        run: python .github/scripts/marker_lint.py --repo . --check --cap conditional-skip=29
